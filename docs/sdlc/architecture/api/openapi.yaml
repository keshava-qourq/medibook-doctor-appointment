      security:
      - bearerAuth: []
    post:
      summary: Book one slot inside a transaction guarded by the unique (doctor_id,
        slot_start) constraint. The loser of a race receive
      description: Book one slot inside a transaction guarded by the unique (doctor_id,
        slot_start) constraint. The loser of a race receives slot_taken and no row
        is written.
      operationId: post_api_appointments
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{doctor_id, slot_start, reason_for_visit?}'
      responses:
        '200':
          description: 201 {id, doctor, slot_start, timezone, room_location, consultation_fee,
            fee_note, visit_type:'in_person'} | 409 slot_taken | 409 duplicate_booking
      security:
      - bearerAuth: []
  /api/appointments/{id}:
